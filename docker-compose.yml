services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: palier
      POSTGRES_PASSWORD: palier
      POSTGRES_DB: palier
    ports:
      - "5433:5432"
    volumes:
      - palier-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palier -d palier"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  palier-postgres:
