<text class="t-code" x="640" y="479">onAisleExit(major, ts)</text>
<text class="t-code" x="640" y="496">onParkedDetected(confidence, ts)  — automotive → walking</text>
<text class="t-code" x="640" y="513">onQueueFlushed(count)</text>
