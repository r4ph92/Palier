<text class="t-cmp" x="92" y="442">Commandes  JS → natif</text>
<text class="t-code" x="92" y="462">startMonitoring(uuid, majors[])   — arme les régions d'allée</text>
<text class="t-code" x="92" y="479">stopMonitoring()                  — à la fermeture de session</text>
<text class="t-code" x="92" y="496">scheduleConfirmPrompt(spot)       — notification locale</text>
<text class="t-code" x="92" y="513">flushOfflineQueue()               — vidange à la reconnexion</text>
<rect class="cmp cmp-accent" x="624" y="416" width="516" height="116" rx="3"/>
