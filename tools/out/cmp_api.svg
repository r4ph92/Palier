<text class="t-cmp-s" x="514" y="479">notifications</text>
<text class="t-cmp-s" x="514" y="493">de confirmation</text>
<rect class="cmp" x="712" y="434" width="192" height="88" rx="3"/>
<text class="t-cmp" x="726" y="460">Client barrière</text>
<text class="t-cmp-s" x="726" y="479">HTTP vers</text>
<text class="t-cmp-s" x="726" y="493">le contrôleur</text>
<rect class="cmp" x="924" y="434" width="192" height="88" rx="3"/>
<text class="t-cmp" x="938" y="460">Signature HMAC</text>
<text class="t-cmp-s" x="938" y="479">jetons de QR</text>
<text class="t-cmp-s" x="938" y="493">de borne</text>
<rect class="bd bd-warn" x="60" y="568" width="1080" height="152" rx="4"/>
<text class="t-band" x="78" y="594">Planificateur</text>
<text class="t-band-s" x="78" y="611">aucun appelant externe : les six transitions déclenchées par le temps</text>
<rect class="cmp cmp-warn" x="76" y="618" width="160" height="88" rx="3"/>
<text class="t-cmp" x="90" y="644">expire_holds</text>
<text class="t-cmp-s" x="90" y="663">30 s</text>
<text class="t-cmp-s" x="90" y="677">HELD → AVAILABLE</text>
<rect class="cmp cmp-warn" x="252" y="618" width="160" height="88" rx="3"/>
<text class="t-cmp" x="266" y="644">cancel_unconfirmed</text>
<text class="t-cmp-s" x="266" y="663">30 s</text>
<text class="t-cmp-s" x="266" y="677">aucun passage en 60 s</text>
<rect class="cmp cmp-warn" x="428" y="618" width="160" height="88" rx="3"/>
<text class="t-cmp" x="442" y="644">release_orphans</text>
<text class="t-cmp-s" x="442" y="663">5 min</text>
<text class="t-cmp-s" x="442" y="677">présume occupée</text>
<rect class="cmp cmp-warn" x="604" y="618" width="160" height="88" rx="3"/>
<text class="t-cmp" x="618" y="644">reconcile_counts</text>
<text class="t-cmp-s" x="618" y="663">1 min</text>
<text class="t-cmp-s" x="618" y="677">compteur vs places</text>
<rect class="cmp cmp-warn" x="780" y="618" width="160" height="88" rx="3"/>
<text class="t-cmp" x="794" y="644">flag_stale</text>
<text class="t-cmp-s" x="794" y="663">quotidienne</text>
<text class="t-cmp-s" x="794" y="677">7 jours sans sortie</text>
<rect class="cmp cmp-warn" x="956" y="618" width="160" height="88" rx="3"/>
<text class="t-cmp" x="970" y="644">purge_events</text>
<text class="t-cmp-s" x="970" y="663">quotidienne</text>
<text class="t-cmp-s" x="970" y="677">rétention 90 jours</text>
<path class="dep" d="M34,60 V520" marker-end="url(#ar4)"/>
<text class="t-dep" transform="translate(24,300) rotate(-90)" text-anchor="middle">sens des dépendances</text>
