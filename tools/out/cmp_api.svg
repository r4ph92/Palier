<text class="t-cmp" x="302" y="276">Sessions</text>
<text class="t-cmp-s" x="302" y="295">machine à états</text>
<text class="t-cmp-s" x="302" y="309">présomption de place</text>
<rect class="cmp" x="500" y="250" width="192" height="88" rx="3"/>
<text class="t-cmp" x="514" y="276">Tarification</text>
<text class="t-cmp-s" x="514" y="295">politique par parking</text>
<text class="t-cmp-s" x="514" y="309">plafond journalier</text>
<rect class="cmp" x="712" y="250" width="192" height="88" rx="3"/>
