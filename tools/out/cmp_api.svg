<text class="t-band" x="78" y="410">Infrastructure</text>
<text class="t-band-s" x="78" y="427">un adaptateur par système externe, remplaçable en test</text>
<rect class="cmp" x="76" y="434" width="192" height="88" rx="3"/>
<text class="t-cmp" x="90" y="460">Dépôt Postgres</text>
<text class="t-cmp-s" x="90" y="479">transactions</text>
<text class="t-cmp-s" x="90" y="493">SKIP LOCKED</text>
