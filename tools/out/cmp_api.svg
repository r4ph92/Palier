<text class="t-cmp-s" x="90" y="121">jeton utilisateur</text>
<text class="t-cmp-s" x="90" y="135">13 endpoints</text>
<rect class="cmp" x="288" y="76" width="192" height="88" rx="3"/>
<text class="t-cmp" x="302" y="102">Routes web</text>
<text class="t-cmp-s" x="302" y="121">jeton de session</text>
<text class="t-cmp-s" x="302" y="135">sans compte · Checkout</text>
<rect class="cmp" x="500" y="76" width="192" height="88" rx="3"/>
